<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Orbitron:wght@400;500&display=swap" rel="stylesheet" />
  <script>

  <style>
    :root {
      --layer-bg: #000000;
      --layer-bar: #ff6600;
      --layer-fg: #ffffff;
      --cover-glow: rgba(255, 255, 255, 0.5);
      --todo-target-width: 24ch;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--layer-bg);
      color: var(--layer-fg);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      width: 100%;
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      max-width: 100%;
      background: var(--layer-bar);
      transition: width 0.35s ease-out;
      pointer-events: none;
    }

    .mark-hit {
      position: absolute;
      top: 1rem;
      left: 1.25rem;
      z-index: 20;
      margin: 0;
      padding: 0.15em 0.2em;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 6px;
      font: inherit;
      font-size: clamp(1.35rem, 3.5vw, 2rem);
      font-style: italic;
      font-weight: 500;
      line-height: 1;
      color: var(--layer-fg);
      user-select: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .mark-hit:hover {
      opacity: 0.9;
    }
    .mark-hit:focus-visible {
      outline: 2px solid var(--layer-fg);
      outline-offset: 3px;
      opacity: 1;
      pointer-events: auto;
    }

    .fs-hit {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      margin: 0;
      padding: 0.3em 0.55em;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.15);
      color: var(--layer-fg);
      border-radius: 8px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .fs-hit:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .fs-hit:focus-visible {
      outline: 2px solid var(--layer-fg);
      outline-offset: 3px;
    }

    .stage {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .spotify-mini {
      position: absolute;
      top: calc(50% - 21rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      color: var(--layer-fg);
      opacity: 0.85;
    }
    .spotify-mini .controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .spotify-mini .cover-shell {
      position: relative;
      width: 140px;
      height: 140px;
      padding: 6px;
      isolation: isolate;
      overflow: visible;
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.32),
        rgba(255, 255, 255, 0.06)
      );
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px) saturate(130%);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
    }
    .spotify-mini .cover-shell::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 55%, var(--cover-glow) 0%, rgba(255, 255, 255, 0) 62%),
        radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--cover-glow) 70%, transparent) 0%, rgba(255, 255, 255, 0) 72%);
      box-shadow:
        0 0 18px 6px color-mix(in srgb, var(--cover-glow) 58%, transparent),
        0 0 28px 10px color-mix(in srgb, var(--cover-glow) 28%, transparent);
      filter: blur(8px);
      opacity: 0.65;
      z-index: -1;
      pointer-events: none;
    }
    .spotify-mini .cover-shell::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 13px;
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.20),
        rgba(255, 255, 255, 0.02) 40%,
        rgba(255, 255, 255, 0.12) 100%
      );
      pointer-events: none;
    }
    .spotify-mini .cover-shell > .cover {
      position: relative;
      z-index: 1;
    }
    .spotify-mini .cover {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.06);
    }
    .spotify-mini button {
      font: inherit;
      color: var(--layer-fg);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.22);
      border-radius: 7px;
      width: 1.95rem;
      height: 1.95rem;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .spotify-mini button:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .spotify-mini .track {
      min-width: 14ch;
      max-width: 30ch;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.88;
    }
    .spotify-mini .hidden {
      display: none;
    }

    .remain {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "vdl-logonagokuhoso", Inter, "Helvetica Neue", Arial, sans-serif;
      font-weight: 200;
      font-size: clamp(3.75rem, 21vw, 10.5rem);
      letter-spacing: 0.04em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: var(--layer-fg);
    }
    .remain .sep {
      display: inline-block;
      margin: 0 0.08em;
      transform: translateY(-0.06em);
      font-weight: 500;
    }

    .goal-wrap {
      margin-top: 0.75rem;
      min-height: 1.6em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .goal {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "vdl-logonagokuhoso", Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1.1rem, 5.25vw, 1.75rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      color: var(--layer-fg);
      opacity: 0.92;
      cursor: text;
      padding: 0.2em 0.45em;
      border-radius: 6px;
      outline: none;
    }
    .goal:hover { background: rgba(255, 255, 255, 0.04); }
    .goal:focus-visible { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25); }
    .goal-input {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 0.2em 0.45em;
      width: 6.5em;
      text-align: center;
    }
    .goal-hint {
      margin-top: 0.35rem;
      font-size: 0;
      opacity: 0.45;
      letter-spacing: 0.02em;
      display: none;
    }
    .todo-wrap {
      position: absolute;
      top: calc(50% + 8.9rem);
      left: 50%;
      transform: translateX(-50%);
      width: min(var(--todo-target-width), 72vw);
      min-height: 8.5rem;
      max-height: 28vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 0.25rem;
      transition: width 0.22s ease;
    }
    .todo {
      width: 100%;
      color: var(--layer-fg);
      opacity: 0.82;
      font-size: clamp(0.8rem, 2.15vw, 1rem);
      line-height: 1.45;
      white-space: pre-line;
      cursor: text;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      user-select: none;
      max-height: 100%;
      overflow-y: auto;
    }
    .todo:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .todo.is-empty {
      opacity: 0;
    }
    .todo.is-empty:hover,
    .todo.is-empty:focus-visible {
      opacity: 0.24;
    }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      min-height: 1.6rem;
    }
    .todo-text {
      flex: 1 1 auto;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .todo-item.done .todo-text {
      color: rgba(255, 255, 255, 0.45);
    }
    .todo-toggle {
      flex: 0 0 auto;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.72rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, background 0.14s ease;
    }
    .todo-item:hover .todo-toggle,
    .todo-toggle:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .todo-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .todo-input {
      width: 100%;
      min-height: 8.5rem;
      max-height: 28vh;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--layer-fg);
      font: inherit;
      font-size: clamp(0.8rem, 2.15vw, 1rem);
      line-height: 1.45;
      text-align: left;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      overflow-y: auto;
    }

    .pct {
      position: absolute;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 10;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      font-style: italic;
      color: var(--layer-fg);
      user-select: none;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .api-dot {
      position: absolute;
      left: 1.25rem;
      bottom: 1.1rem;
      z-index: 10;
      font-size: 0.65rem;
      opacity: 0;
      color: var(--layer-fg);
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .shell:hover .fs-hit,
    .shell:hover .api-dot,
    .shell:hover .mark-hit,
    .shell:hover .pct {
      opacity: 1;
    }

    .shell:hover .fs-hit,
    .shell:hover .mark-hit {
      pointer-events: auto;
    }

    .fs-hit:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }

    dialog {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0;
      background: #121214;
      color: #fafafa;
      max-width: min(360px, calc(100vw - 2rem));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }
    .panel {
      padding: 1.1rem 1.25rem 1.25rem;
    }
    .panel h2 {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .row:last-of-type { margin-bottom: 0; }
    .row label { font-size: 0.8rem; color: #a1a1aa; }
    .row input[type="color"] {
      width: 52px;
      height: 32px;
      padding: 0;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .panel-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }
    .panel-actions button {
      font: inherit;
      font-size: 0.8rem;
      padding: 0.45em 0.9em;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fafafa;
      cursor: pointer;
    }
    .panel-actions button:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <button type="button" class="mark-hit" id="openSettings" aria-label="Open appearance settings">
      <span aria-hidden="true">力</span>
    </button>
    <button type="button" class="fs-hit" id="toggleFullscreen" aria-label="Toggle fullscreen">Fullscreen</button>

    <div class="stage">
      <div class="spotify-mini" id="spotifyMini">
        <button type="button" id="spotifyLogin">Connect Spotify</button>
        <div class="cover-shell hidden" id="spotifyCoverShell">
          <img class="cover" id="spotifyCover" alt="Album cover" />
        </div>
        <div class="controls">
          <button type="button" id="spotifyPrev" class="hidden" title="Previous track" aria-label="Previous track">⏮</button>
          <button type="button" id="spotifyPlayPause" class="hidden" title="Play or pause" aria-label="Play or pause">▶</button>
          <button type="button" id="spotifyNext" class="hidden" title="Next track" aria-label="Next track">⏭</button>
        </div>
        <span class="track hidden" id="spotifyTrack">Not connected</span>
      </div>
      <div class="remain" id="remain" aria-live="polite">00:00:00</div>
      <div class="goal-wrap">
        <div class="goal" id="goal" role="button" tabindex="0" title="Double-click to edit goal time">--:--</div>
      </div>
      <div class="todo-wrap">
        <div class="todo is-empty" id="todo" role="button" tabindex="0"></div>
      </div>
      <p class="goal-hint" id="goalHint"></p>
    </div>

    <div class="pct" id="pct" aria-hidden="true">0,00%</div>
    <p class="api-dot" id="status">API …</p>
  </div>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="panel">
      <h2 id="settingsTitle">Appearance</h2>
      <div class="row">
        <label for="c-bg">Background</label>
        <input type="color" id="c-bg" value="#000000" />
      </div>
      <div class="row">
        <label for="c-bar">Side bar</label>
        <input type="color" id="c-bar" value="#ff6600" />
      </div>
      <div class="row">
        <label for="c-fg">Numbers &amp; symbol</label>
        <input type="color" id="c-fg" value="#ffffff" />
      </div>
      <div class="panel-actions">
        <button type="button" id="resetColors">Reset</button>
        <button type="submit" value="close">Done</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = 'countdownApp:v1';

    // Production: set your Railway HTTPS URL after deploy (no trailing slash).
    // Example: https://custom-countdown-api-production-xxxx.up.railway.app
    const BACKEND_URL_PRODUCTION = 'https://custom-countdown-production.up.railway.app';
    const BACKEND_URL = /localhost|127\.0\.0\.1/.test(window.location.hostname)
      ? 'http://localhost:8001'
      : (BACKEND_URL_PRODUCTION.trim().replace(/\/$/, '') || 'https://YOUR-RAILWAY-APP.up.railway.app');

    // Spotify: PKCE in the browser (tokens in localStorage). Register this exact redirect_uri in the Spotify app.
    const SPOTIFY_CLIENT_ID = '7de1562fccfd466bbb0c6a7d6d767bfe';
    const SPOTIFY_SCOPE =
      'user-read-playback-state user-modify-playback-state user-read-currently-playing';
    const SPOTIFY_STORAGE_KEY = 'countdownSpotifyPKCE:v1';
    const SPOTIFY_ACCOUNTS = 'https://accounts.spotify.com';
    const SPOTIFY_API = 'https://api.spotify.com/v1';

    function spotifyRedirectUri() {
      return `${window.location.origin}${window.location.pathname}`;
    }

    function spotifyLoadTokens() {
      try {
        const raw = localStorage.getItem(SPOTIFY_STORAGE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!o || typeof o.access_token !== 'string') return null;
        return o;
      } catch {
        return null;
      }
    }

    function spotifySaveTokens(partial) {
      const prev = spotifyLoadTokens() || {};
      const next = { ...prev, ...partial };
      if (!partial.refresh_token && prev.refresh_token) {
        next.refresh_token = prev.refresh_token;
      }
      localStorage.setItem(SPOTIFY_STORAGE_KEY, JSON.stringify(next));
    }

    function spotifyClearTokens() {
      localStorage.removeItem(SPOTIFY_STORAGE_KEY);
    }

    function randomPkceVerifier() {
      const a = new Uint8Array(64);
      crypto.getRandomValues(a);
      return btoa(String.fromCharCode(...a))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function sha256Base64Url(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', data);
      const bytes = new Uint8Array(hash);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function spotifyStartLogin() {
      const verifier = randomPkceVerifier();
      const challenge = await sha256Base64Url(verifier);
      const state = crypto.randomUUID();
      sessionStorage.setItem('spotify_pkce_v', verifier);
      sessionStorage.setItem('spotify_pkce_s', state);
      const q = new URLSearchParams({
        response_type: 'code',
        client_id: SPOTIFY_CLIENT_ID,
        scope: SPOTIFY_SCOPE,
        redirect_uri: spotifyRedirectUri(),
        state,
        code_challenge_method: 'S256',
        code_challenge: challenge,
        show_dialog: 'true',
      });
      window.location.href = `${SPOTIFY_ACCOUNTS}/authorize?${q}`;
    }

    async function spotifyExchangeCode(code) {
      const verifier = sessionStorage.getItem('spotify_pkce_v');
      sessionStorage.removeItem('spotify_pkce_v');
      sessionStorage.removeItem('spotify_pkce_s');
      if (!verifier) throw new Error('Missing PKCE verifier');
      const body = new URLSearchParams({
        grant_type: 'authorization_code',
        code,
        redirect_uri: spotifyRedirectUri(),
        client_id: SPOTIFY_CLIENT_ID,
        code_verifier: verifier,
      });
      const res = await fetch(`${SPOTIFY_ACCOUNTS}/api/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      if (!res.ok) {
        let detail = 'Token exchange failed';
        try {
          const err = await res.json();
          if (err.error_description) detail = err.error_description;
          else if (err.error) detail = err.error;
        } catch {}
        throw new Error(detail);
      }
      const tok = await res.json();
      const expires_at_ms = Date.now() + (tok.expires_in || 3600) * 1000 - 30_000;
      spotifySaveTokens({
        access_token: tok.access_token,
        refresh_token: tok.refresh_token,
        expires_at_ms,
      });
    }

    async function spotifyRefreshAccess() {
      const t = spotifyLoadTokens();
      if (!t || !t.refresh_token) return null;
      const body = new URLSearchParams({
        grant_type: 'refresh_token',
        refresh_token: t.refresh_token,
        client_id: SPOTIFY_CLIENT_ID,
      });
      const res = await fetch(`${SPOTIFY_ACCOUNTS}/api/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      if (!res.ok) {
        spotifyClearTokens();
        return null;
      }
      const tok = await res.json();
      const expires_at_ms = Date.now() + (tok.expires_in || 3600) * 1000 - 30_000;
      spotifySaveTokens({
        access_token: tok.access_token,
        expires_at_ms,
        refresh_token: tok.refresh_token || t.refresh_token,
      });
      return spotifyLoadTokens().access_token;
    }

    async function spotifyEnsureAccess() {
      const t = spotifyLoadTokens();
      if (!t || !t.access_token) return null;
      if (typeof t.expires_at_ms !== 'number' || Date.now() >= t.expires_at_ms) {
        return spotifyRefreshAccess();
      }
      return t.access_token;
    }

    function spotifyStripOAuthParams() {
      const url = new URL(window.location.href);
      ['code', 'state', 'error', 'error_description'].forEach((k) => url.searchParams.delete(k));
      const qs = url.searchParams.toString();
      history.replaceState({}, '', url.pathname + (qs ? '?' + qs : '') + url.hash);
    }

    async function spotifyHandleOAuthReturn() {
      const url = new URL(window.location.href);
      const err = url.searchParams.get('error');
      if (err) {
        const msg = url.searchParams.get('error_description') || err;
        spotifyStripOAuthParams();
        spotifyTrack.textContent = `Spotify: ${msg}`;
        return;
      }
      const code = url.searchParams.get('code');
      const state = url.searchParams.get('state');
      if (!code) return;
      const savedState = sessionStorage.getItem('spotify_pkce_s');
      if (!savedState || state !== savedState) {
        spotifyStripOAuthParams();
        return;
      }
      try {
        await spotifyExchangeCode(code);
      } catch (e) {
        spotifyTrack.textContent = e.message || 'Spotify login failed';
      }
      spotifyStripOAuthParams();
    }

    function mapPlayerToLine(player) {
      if (!player || !player.item) {
        return {
          connected: true,
          is_playing: !!player?.is_playing,
          track_name: '',
          artist_name: '',
          album_cover_url: null,
        };
      }
      const item = player.item;
      const artists = (item.artists || []).map((a) => a.name).filter(Boolean).join(', ');
      const cover = item.album?.images?.[0]?.url || null;
      return {
        connected: true,
        is_playing: !!player.is_playing,
        track_name: item.name || '',
        artist_name: artists,
        album_cover_url: cover,
      };
    }

    const defaultColors = () => ({
      bg: '#000000',
      bar: '#ff6600',
      fg: '#ffffff',
    });

    function defaultEndMs() {
      const n = new Date();
      const g = new Date(n);
      g.setHours(17, 0, 0, 0);
      if (g.getTime() <= n.getTime()) g.setDate(g.getDate() + 1);
      return g.getTime();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (o.v !== 1 || typeof o.startMs !== 'number' || typeof o.endMs !== 'number') return null;
        return o;
      } catch {
        return null;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: 1, ...state }));
    }

    function applyColors(colors) {
      document.documentElement.style.setProperty('--layer-bg', colors.bg);
      document.documentElement.style.setProperty('--layer-bar', colors.bar);
      document.documentElement.style.setProperty('--layer-fg', colors.fg);
      document.getElementById('c-bg').value = colors.bg;
      document.getElementById('c-bar').value = colors.bar;
      document.getElementById('c-fg').value = colors.fg;
    }

    /** @type {{ startMs: number, endMs: number, colors: { bg: string, bar: string, fg: string }, todos?: string, todoItems?: Array<{ text: string, done: boolean }> }} */
    let state = loadState();
    if (!state) {
      const endMs = defaultEndMs();
      state = {
        startMs: Date.now(),
        endMs,
        colors: defaultColors(),
        todos: '',
        todoItems: [],
      };
      saveState(state);
    }
    if (!state.colors) state.colors = defaultColors();
    if (typeof state.todos !== 'string') state.todos = '';
    if (!Array.isArray(state.todoItems)) {
      const legacyLines = state.todos
        .split('\n')
        .map((line) => line.replace(/^•\s*/, '').trim())
        .filter(Boolean);
      state.todoItems = legacyLines.map((text) => ({ text, done: false }));
    }
    applyColors(state.colors);

    const elBar = document.getElementById('bar');
    const elRemain = document.getElementById('remain');
    const elGoal = document.getElementById('goal');
    const elPct = document.getElementById('pct');
    const dialogEl = document.getElementById('settings');
    const fsBtn = document.getElementById('toggleFullscreen');
    const spotifyLoginBtn = document.getElementById('spotifyLogin');
    const spotifyPrevBtn = document.getElementById('spotifyPrev');
    const spotifyPlayPauseBtn = document.getElementById('spotifyPlayPause');
    const spotifyNextBtn = document.getElementById('spotifyNext');
    const spotifyCoverShell = document.getElementById('spotifyCoverShell');
    const spotifyCover = document.getElementById('spotifyCover');
    const spotifyTrack = document.getElementById('spotifyTrack');
    const todoEl = document.getElementById('todo');

    function formatRemain(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      return `${hh}<span class="sep">:</span>${mm}`;
    }

    function formatPct(p) {
      const clamped = Math.min(100, Math.max(0, p));
      return new Intl.NumberFormat('de-DE', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(clamped) + '%';
    }

    function formatGoalTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function parseTimeToEndMs(text) {
      const t = text.trim();
      const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(t);
      if (!m) return null;
      const hh = parseInt(m[1], 10);
      const mm = parseInt(m[2], 10);
      const now = new Date();
      const target = new Date(now);
      target.setHours(hh, mm, 0, 0);
      if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
      return target.getTime();
    }

    function tick() {
      const now = Date.now();
      const { startMs, endMs } = state;
      const total = endMs - startMs;
      let progress = 0;
      if (total > 0) {
        progress = ((now - startMs) / total) * 100;
        if (progress < 0) progress = 0;
        if (progress > 100) progress = 100;
      } else progress = 100;

      const left = Math.max(0, endMs - now);
      elRemain.innerHTML = formatRemain(left);
      elBar.style.width = progress + '%';
      elPct.textContent = formatPct(progress);
      elGoal.textContent = formatGoalTime(endMs);
    }

    let goalEdit = null;
    let todoEdit = null;

    function renderTodo() {
      todoEl.innerHTML = '';
      const items = Array.isArray(state.todoItems) ? state.todoItems : [];
      todoEl.classList.toggle('is-empty', items.length === 0);
      if (!items.length) {
        updateTodoWidth('');
        return;
      }
      const list = document.createElement('div');
      list.className = 'todo-list';
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = `todo-item${item.done ? ' done' : ''}`;

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = item.text;
        row.appendChild(text);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'todo-toggle';
        toggle.setAttribute('aria-label', item.done ? 'Mark as not done' : 'Mark as done');
        toggle.textContent = item.done ? '↺' : '✓';
        toggle.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          state.todoItems[index].done = !state.todoItems[index].done;
          state.todos = state.todoItems.map((it) => it.text).join('\n');
          saveState(state);
          renderTodo();
        });
        row.appendChild(toggle);
        list.appendChild(row);
      });
      todoEl.appendChild(list);
      updateTodoWidth(items.map((it) => it.text).join('\n'));
    }

    function updateTodoWidth(rawText) {
      const lines = (rawText || '')
        .split('\n')
        .map((line) => line.replace(/^•\s*/, '').trim())
        .filter(Boolean);
      const longest = lines.reduce((max, line) => Math.max(max, line.length), 0);
      const widthCh = Math.min(44, Math.max(18, longest + 5));
      document.documentElement.style.setProperty('--todo-target-width', `${widthCh}ch`);
    }

    function finishTodoEdit(commit) {
      if (!todoEdit) return;
      const { input, wrap, previous } = todoEdit;
      const raw = input.value;
      wrap.removeChild(input);
      todoEl.style.display = '';
      todoEdit = null;
      if (!commit) {
        state.todos = previous;
      } else {
        const lines = raw
          .split('\n')
          .map((line) => line.replace(/^•\s*/, '').trim())
          .filter(Boolean);
        const doneByText = new Map((state.todoItems || []).map((item) => [item.text, !!item.done]));
        state.todoItems = lines.map((text) => ({ text, done: doneByText.get(text) || false }));
        state.todos = lines.join('\n');
      }
      saveState(state);
      renderTodo();
    }

    function startTodoEdit() {
      if (todoEdit) return;
      const wrap = todoEl.parentElement;
      const previous = state.todos || '';
      todoEl.style.display = 'none';
      const input = document.createElement('textarea');
      input.className = 'todo-input';
      input.setAttribute('aria-label', 'Todo list');
      input.setAttribute('placeholder', 'Type todos, one per line');
      input.value = previous;
      updateTodoWidth(previous);
      wrap.appendChild(input);
      todoEdit = { input, wrap, previous };
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      input.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          finishTodoEdit(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finishTodoEdit(false);
        }
      });
      input.addEventListener('input', () => {
        updateTodoWidth(input.value);
      });
      input.addEventListener('blur', () => finishTodoEdit(true));
    }

    function finishGoalEdit(commit) {
      if (!goalEdit) return;
      const input = goalEdit.input;
      const prev = goalEdit.prevText;
      const raw = input.value;
      goalEdit.wrap.removeChild(input);
      elGoal.style.display = '';
      goalEdit = null;
      if (!commit) {
        elGoal.textContent = prev;
        return;
      }
      const endMs = parseTimeToEndMs(raw);
      if (endMs == null) {
        elGoal.textContent = prev;
        return;
      }
      state.startMs = Date.now();
      state.endMs = endMs;
      saveState(state);
      tick();
    }

    function startGoalEdit() {
      if (goalEdit) return;
      const prevText = elGoal.textContent.trim();
      elGoal.style.display = 'none';
      const wrap = elGoal.parentElement;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'goal-input';
      input.value = prevText.replace(/[^\d:]/g, '') || formatGoalTime(state.endMs);
      input.setAttribute('aria-label', 'Goal time (HH:MM)');
      input.setAttribute('inputmode', 'numeric');
      wrap.appendChild(input);
      goalEdit = { input, prevText, wrap };
      input.focus();
      input.select();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finishGoalEdit(true);
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          finishGoalEdit(false);
        }
      });
      input.addEventListener('blur', () => finishGoalEdit(true));
    }

    elGoal.addEventListener('dblclick', (e) => {
      e.preventDefault();
      startGoalEdit();
    });
    elGoal.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startGoalEdit();
      }
    });
    todoEl.addEventListener('dblclick', (e) => {
      e.preventDefault();
      startTodoEdit();
    });
    todoEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startTodoEdit();
      }
    });

    document.getElementById('openSettings').addEventListener('click', () => {
      if (typeof dialogEl.showModal === 'function') dialogEl.showModal();
    });

    async function toggleFullscreen() {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    }

    function syncFullscreenLabel() {
      fsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    }

    fsBtn.addEventListener('click', async () => {
      try {
        await toggleFullscreen();
      } catch {
        // Ignore if browser blocks fullscreen request.
      }
      syncFullscreenLabel();
    });

    document.addEventListener('fullscreenchange', syncFullscreenLabel);
    syncFullscreenLabel();

    function toggleSpotifyControls(connected) {
      const hiddenClass = 'hidden';
      spotifyLoginBtn.classList.toggle(hiddenClass, connected);
      spotifyPrevBtn.classList.toggle(hiddenClass, !connected);
      spotifyPlayPauseBtn.classList.toggle(hiddenClass, !connected);
      spotifyNextBtn.classList.toggle(hiddenClass, !connected);
      spotifyCoverShell.classList.toggle(hiddenClass, !connected);
      spotifyTrack.classList.toggle(hiddenClass, !connected);
    }

    async function refreshSpotifyStatus() {
      const token = await spotifyEnsureAccess();
      if (!token) {
        updateSpotifyTrackLine({ connected: false });
        return;
      }
      try {
        const res = await fetch(`${SPOTIFY_API}/me/player`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.status === 401) {
          spotifyClearTokens();
          updateSpotifyTrackLine({ connected: false });
          return;
        }
        if (res.status === 204) {
          updateSpotifyTrackLine({
            connected: true,
            is_playing: false,
            track_name: '',
            artist_name: '',
            album_cover_url: null,
          });
          return;
        }
        if (!res.ok) {
          updateSpotifyTrackLine({
            connected: true,
            is_playing: false,
            track_name: '',
            artist_name: '',
            album_cover_url: null,
          });
          return;
        }
        const player = await res.json();
        updateSpotifyTrackLine(mapPlayerToLine(player));
      } catch {
        updateSpotifyTrackLine({ connected: false });
      }
    }

    async function spotifySendControl(method, path) {
      const token = await spotifyEnsureAccess();
      if (!token) return;
      const res = await fetch(`${SPOTIFY_API}${path}`, {
        method,
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) spotifyClearTokens();
    }

    async function spotifyTogglePlayPause() {
      const token = await spotifyEnsureAccess();
      if (!token) return;
      const st = await fetch(`${SPOTIFY_API}/me/player`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (st.status === 401) {
        spotifyClearTokens();
        return;
      }
      if (st.status === 204) {
        await fetch(`${SPOTIFY_API}/me/player/play`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}` },
        });
        return;
      }
      if (!st.ok) return;
      const player = await st.json();
      const next = player.is_playing ? 'pause' : 'play';
      await fetch(`${SPOTIFY_API}/me/player/${next}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}` },
      });
    }

    function updateSpotifyTrackLine(data) {
      if (!data || !data.connected) {
        spotifyTrack.textContent = 'Not connected';
        spotifyPlayPauseBtn.textContent = '▶';
        spotifyCover.removeAttribute('src');
        document.documentElement.style.setProperty('--cover-glow', 'rgba(255, 255, 255, 0.22)');
        toggleSpotifyControls(false);
        return;
      }
      toggleSpotifyControls(true);
      const track = data.track_name ? `${data.track_name}${data.artist_name ? ` - ${data.artist_name}` : ''}` : 'No active track';
      spotifyTrack.textContent = track;
      spotifyPlayPauseBtn.textContent = data.is_playing ? '⏸' : '▶';
      if (data.album_cover_url) {
        spotifyCover.src = data.album_cover_url;
      } else {
        spotifyCover.removeAttribute('src');
        document.documentElement.style.setProperty('--cover-glow', 'rgba(255, 255, 255, 0.22)');
      }
    }

    function applyCoverGlowColor() {
      if (!spotifyCover.naturalWidth || !spotifyCover.naturalHeight) return;
      const sample = document.createElement('canvas');
      const ctx = sample.getContext('2d', { willReadFrequently: true });
      if (!ctx) return;
      sample.width = 32;
      sample.height = 32;
      ctx.drawImage(spotifyCover, 0, 0, 32, 32);
      const { data } = ctx.getImageData(0, 0, 32, 32);
      let r = 0;
      let g = 0;
      let b = 0;
      let total = 0;
      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3] / 255;
        if (alpha < 0.1) continue;
        r += data[i] * alpha;
        g += data[i + 1] * alpha;
        b += data[i + 2] * alpha;
        total += alpha;
      }
      if (!total) return;
      r = Math.round(r / total);
      g = Math.round(g / total);
      b = Math.round(b / total);
      document.documentElement.style.setProperty('--cover-glow', `rgba(${r}, ${g}, ${b}, 0.45)`);
    }

    spotifyCover.addEventListener('load', applyCoverGlowColor);

    spotifyLoginBtn.addEventListener('click', () => {
      spotifyStartLogin();
    });
    spotifyPrevBtn.addEventListener('click', async () => {
      try {
        await spotifySendControl('POST', '/me/player/previous');
      } catch {}
      refreshSpotifyStatus();
    });
    spotifyPlayPauseBtn.addEventListener('click', async () => {
      try {
        await spotifyTogglePlayPause();
      } catch {}
      refreshSpotifyStatus();
    });
    spotifyNextBtn.addEventListener('click', async () => {
      try {
        await spotifySendControl('POST', '/me/player/next');
      } catch {}
      refreshSpotifyStatus();
    });

    document.getElementById('resetColors').addEventListener('click', () => {
      state.colors = defaultColors();
      applyColors(state.colors);
      saveState(state);
    });

    ['c-bg', 'c-bar', 'c-fg'].forEach((id) => {
      document.getElementById(id).addEventListener('input', (e) => {
        const v = /** @type {HTMLInputElement} */ (e.target).value;
        if (id === 'c-bg') state.colors.bg = v;
        if (id === 'c-bar') state.colors.bar = v;
        if (id === 'c-fg') state.colors.fg = v;
        applyColors(state.colors);
        saveState(state);
      });
    });

    tick();
    renderTodo();
    setInterval(tick, 250);
    (async () => {
      await spotifyHandleOAuthReturn();
      refreshSpotifyStatus();
      setInterval(refreshSpotifyStatus, 5000);
    })();

    fetch(`${BACKEND_URL}/api/health`)
      .then((r) => r.json())
      .then((d) => {
        document.getElementById('status').textContent =
          d.status === 'ok' ? 'API · ok' : 'API · ' + d.status;
      })
      .catch(() => {
        document.getElementById('status').textContent = 'API · offline';
      });
  </script>
</body>
</html>
